name: Daily Quantum Digest

on:
  schedule:
    - cron: '30 2 * * *'   # runs daily at 8:00 AM IST (2:30 AM UTC)
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run digest script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/daily-digest.js

      - name: Commit and push if changed
        run: |
          git config user.name "quantum-digest-bot"
          git config user.email "actions@github.com"
          git add articles.json
          git diff --staged --quiet || git commit -m "Daily quantum digest update"
          git push
