<style>
  :root{
    --void:#0A0E1A;--panel:#121826;--ink:#E4E7F1;--fog:#6B7390;--fog-dim:#454C63;
    --photon:#4FD8E8;--collapse:#C77DFF;--line:#232B3D;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--void);color:var(--ink);font-family:'Inter',sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:64px 24px 80px;}
  .hero{position:relative;padding:40px 0 56px;overflow:hidden;}
  .hero svg{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:140%;max-width:900px;opacity:0.35;}
  .hero-inner{position:relative;z-index:1;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--photon);margin:0 0 14px;}
  h1{font-family:'Fraunces',serif;font-weight:500;font-size:52px;line-height:1.05;margin:0 0 18px;letter-spacing:-0.01em;}
  .sub{color:var(--fog);font-size:16px;line-height:1.6;max-width:520px;margin:0;}
  .toolbar{display:flex;align-items:center;justify-content:space-between;margin:8px 0 28px;padding-top:28px;border-top:1px solid var(--line);flex-wrap:wrap;gap:12px;}
  .count{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--fog);}
  .lang-picker{display:flex;align-items:center;gap:8px;}
  .lang-picker label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--fog);text-transform:uppercase;letter-spacing:0.06em;}
  .lang-picker select{font-family:'JetBrains Mono',monospace;font-size:12px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:6px 10px;}
  .translating{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--fog-dim);}
  .entry{display:grid;grid-template-columns:96px 1fr;gap:20px;padding:22px 0;border-top:1px solid var(--line);}
  .entry:last-child{border-bottom:1px solid var(--line);}
  .stamp{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--fog);padding-top:3px;}
  .etitle{font-family:'Fraunces',serif;font-weight:500;font-size:19px;line-height:1.3;margin:0 0 8px;}
  .esum{color:var(--fog);font-size:14px;line-height:1.6;margin:0 0 10px;}
  .emeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--collapse);background:rgba(199,125,255,0.1);border-radius:3px;padding:3px 8px;}
  .src{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--photon);text-decoration:none;}
  .src:hover{text-decoration:underline;}
  .empty{padding:48px 0;text-align:center;color:var(--fog);font-size:14px;border-top:1px solid var(--line);}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <svg viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#4FD8E8" stroke-width="1" fill="none" opacity="0.5">
        <path d="M0,100 Q75,20 150,100 T300,100 T450,100 T600,100"/>
        <path d="M0,100 Q75,180 150,100 T300,100 T450,100 T600,100"/>
        <path d="M0,60 Q75,130 150,60 T300,60 T450,60 T600,60" opacity="0.6"/>
        <path d="M0,140 Q75,70 150,140 T300,140 T450,140 T600,140" opacity="0.6"/>
      </g>
    </svg>
    <div class="hero-inner">
      <p class="eyebrow" id="eyebrow">Daily readout // quantum computing research</p>
      <h1 id="pageTitle">Quantum Digest</h1>
      <p class="sub" id="pageSub">New quantum computing papers and results, translated out of jargon. One entry a day, logged automatically as it lands.</p>
    </div>
  </div>
  <!-- Google AdSense ad unit: create this ad unit in your AdSense dashboard and paste its data-ad-slot number below -->
  <ins class="adsbygoogle"
       style="display:block; margin: 0 0 28px;"
       data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
       data-ad-slot="0000000000"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

  <div class="toolbar">
    <span class="count" id="count">loading…</span>
    <div class="lang-picker">
      <label for="langSelect">Language</label>
      <select id="langSelect"></select>
      <span class="translating" id="translatingNote"></span>
    </div>
  </div>
  <div id="list"><div class="empty">reading the log…</div></div>
</div>
<script>
const LANGS = {
  en: 'English', hi: 'हिन्दी', de: 'Deutsch', fr: 'Français', es: 'Español',
  ja: '日本語', zh: '中文', pt: 'Português', ru: 'Русский', ar: 'العربية', it: 'Italiano'
};

const UI_STRINGS = {
  eyebrow: 'Daily readout // quantum computing research',
  title: 'Quantum Digest',
  sub: 'New quantum computing papers and results, translated out of jargon. One entry a day, logged automatically as it lands.',
  empty: 'No entries logged yet.',
  loadError: 'Could not load articles.json.',
  source: 'source'
};

function detectLanguage(){
  const saved = localStorage.getItem('qdigest-lang');
  if(saved && LANGS[saved]) return saved;
  const browserLang = (navigator.language || 'en').split('-')[0];
  return LANGS[browserLang] ? browserLang : 'en';
}

let currentLang = detectLanguage();
let articlesCache = [];

const selectEl = document.getElementById('langSelect');
Object.keys(LANGS).forEach(code => {
  const opt = document.createElement('option');
  opt.value = code;
  opt.textContent = LANGS[code];
  if(code === currentLang) opt.selected = true;
  selectEl.appendChild(opt);
});
selectEl.onchange = () => {
  currentLang = selectEl.value;
  localStorage.setItem('qdigest-lang', currentLang);
  renderForLanguage();
};

async function translateText(text, targetLang){
  if(targetLang === 'en' || !text) return text;
  const cacheKey = 'qdigest-tr:' + targetLang + ':' + text;
  const cached = localStorage.getItem(cacheKey);
  if(cached) return cached;
  try{
    const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=en|' + targetLang;
    const res = await fetch(url);
    const data = await res.json();
    const translated = (data.responseData && data.responseData.translatedText) ? data.responseData.translatedText : text;
    localStorage.setItem(cacheKey, translated);
    return translated;
  }catch(e){
    return text;
  }
}

async function translateUI(targetLang){
  const note = document.getElementById('translatingNote');
  if(targetLang === 'en'){
    document.getElementById('eyebrow').textContent = UI_STRINGS.eyebrow;
    document.getElementById('pageTitle').textContent = UI_STRINGS.title;
    document.getElementById('pageSub').textContent = UI_STRINGS.sub;
    return;
  }
  note.textContent = 'translating…';
  const [eyebrow, sub] = await Promise.all([
    translateText(UI_STRINGS.eyebrow, targetLang),
    translateText(UI_STRINGS.sub, targetLang)
  ]);
  document.getElementById('eyebrow').textContent = eyebrow;
  document.getElementById('pageSub').textContent = sub;
  note.textContent = '';
}

function fmtDate(iso, lang){
  const d = new Date(iso);
  try{
    return d.toLocaleDateString(lang, { month: 'short', day: '2-digit', year: 'numeric' });
  }catch(e){
    return d.toLocaleDateString('en', { month: 'short', day: '2-digit', year: 'numeric' });
  }
}

async function renderForLanguage(){
  const listEl = document.getElementById('list');
  const note = document.getElementById('translatingNote');
  translateUI(currentLang);

  if(articlesCache.length === 0){
    listEl.innerHTML = `<div class="empty">${UI_STRINGS.empty}</div>`;
    return;
  }

  if(currentLang === 'en'){
    renderEntries(articlesCache);
    return;
  }

  note.textContent = 'translating…';
  const translated = await Promise.all(articlesCache.map(async e => ({
    ...e,
    title: await translateText(e.title, currentLang),
    summary: await translateText(e.summary, currentLang),
    tag: await translateText(e.tag, currentLang)
  })));
  note.textContent = '';
  renderEntries(translated);
}

function renderEntries(entries){
  const listEl = document.getElementById('list');
  const sourceWord = currentLang === 'en' ? 'source' : UI_STRINGS.source;
  listEl.innerHTML = entries.map(e => `
    <div class="entry">
      <div class="stamp">${fmtDate(e.date, currentLang)}</div>
      <div>
        <p class="etitle">${e.title}</p>
        <p class="esum">${e.summary}</p>
        <div class="emeta">
          ${e.tag ? `<span class="tag">${e.tag}</span>` : ''}
          ${e.link ? `<a class="src" href="${e.link}" target="_blank" rel="noopener">${sourceWord} ↗</a>` : ''}
        </div>
      </div>
    </div>
  `).join('');
}

fetch('articles.json?_=' + Date.now())
  .then(r => r.json())
  .then(entries => {
    entries.sort((a,b) => new Date(b.date) - new Date(a.date));
    articlesCache = entries;
    document.getElementById('count').textContent = entries.length + (entries.length === 1 ? ' entry' : ' entries');
    renderForLanguage();
  })
  .catch(() => {
    document.getElementById('list').innerHTML = `<div class="empty">${UI_STRINGS.loadError}</div>`;
  });
</script>
</body>
